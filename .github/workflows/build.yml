name: Build & Release

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: xeokit/xeokit-metadata/xeokit-metadata.csproj
  SOLUTION_PATH: xeokit/xeokit.sln

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Test (chạy trên mọi push / PR)
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration Release --verbosity normal

  # ──────────────────────────────────────────────
  # Job 2: Build binaries cho mọi platform
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.rid }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            artifact: linux-x64
          - rid: linux-musl-x64
            artifact: linux-musl-x64
          - rid: linux-arm
            artifact: linux-arm
          - rid: linux-arm64
            artifact: linux-arm64
          - rid: win-x64
            artifact: win-x64
          - rid: win-x86
            artifact: win-x86
          - rid: win-arm
            artifact: win-arm
          - rid: win-arm64
            artifact: win-arm64
          - rid: osx-x64
            artifact: osx-x64
          - rid: osx.11.0-arm64
            artifact: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish binary
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish/${{ matrix.artifact }}

      - name: Create tar.gz archive
        run: |
          cd publish
          tar -czf ../xeokit-metadata-${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeokit-metadata-${{ matrix.artifact }}
          path: xeokit-metadata-${{ matrix.artifact }}.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 3: Tạo GitHub Release với tất cả artifacts
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: xeokit-metadata-*
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
